[project]
name = "expert-factory"
version = "0.2.0"
description = "Builds a queryable expert from a pack of code, docs, papers and notes: graph + stdio MCP server + skill"
requires-python = ">=3.11"
# graphifyy[all] carries the whole toolchain: extraction grammars, mcp, networkx,
# pypdf. One install therefore covers both building and serving, which is what
# lets a client config say `command: "ef"` with no path or interpreter selection.
dependencies = ["graphifyy[all]"]

[project.scripts]
ef = "ef.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
