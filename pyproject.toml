[project]
name = "expert-factory"
version = "0.2.0"
description = "Builds a queryable expert from a pack of code, docs, papers and notes: graph + stdio MCP server + skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# graphifyy[all] carries the whole toolchain: extraction grammars, mcp, networkx,
# pypdf. One install therefore covers both building and serving, which is what
# lets a client config say `command: "ef"` with no path or interpreter selection.
#
# mcp is pinned to 2.x directly because graphifyy asks only for <3,>=1, a range
# spanning two majors: server.py uses mcp.server.mcpserver, which exists only in
# 2.x, so resolving to 1.x builds an `ef` whose serve path cannot import.
dependencies = ["graphifyy[all]", "mcp>=2,<3"]

[project.scripts]
ef = "ef.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
